<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Dinâmica com Scroll Automático</title>
  <style>
.container {
    position: relative; /* Define o contêiner como referência para elementos filhos posicionados */
    width: 300px;
    height: 200px;
    border: 1px solid black;
}

.elemento-base {
    position: relative; /* Elemento base */
    width: 100%;
    height: 100%;
    background-color: lightblue;
    z-index: 1; /* Menor z-index */
}

.elemento-sobreposto {
    position: absolute; /* Elemento sobreposto */
    top: 50px; /* Posição vertical relativa ao contêiner */
    left: 50px; /* Posição horizontal relativa ao contêiner */
    width: 150px;
    height: 100px;
    background-color: lightcoral;
    z-index: 2; /* Maior z-index para ficar em cima */
}

  </style>
</head>
<body>
  <div class="container">
    <div class="elemento-base">Elemento Base</div>
    <div class="elemento-sobreposto">Elemento Sobreposto</div>
</div>
</body>
</html>
